<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<!-- 司字印章：白色印章内框 + 「司」字，延续现有顶栏 26×26 品牌印章与登录页 56×56 印章，落地零改版；字重最重、最稳。 -->
  <defs>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B45309"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#g6)"/>
  <rect x="19" y="19" width="90" height="90" rx="19" fill="none"
        stroke="#FFFFFF" stroke-width="3.5" opacity="0.62"/>
  <text x="64" y="90" text-anchor="middle" fill="#FFFFFF" font-weight="700"
        font-size="66" font-family="Microsoft YaHei, Microsoft YaHei UI, PingFang SC, sans-serif">司</text>
</svg>
